name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - lab3

    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: mywebapp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/mywebapp:latest \
            -t ghcr.io/${{ github.repository }}/mywebapp:sha-${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/mywebapp:latest
          docker push ghcr.io/${{ github.repository }}/mywebapp:sha-${{ github.sha }}
