name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - lab3

    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        id: repo
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set Docker tags for branch
        if: github.ref_type == 'branch'
        id: branch_tags
        run: |
          echo "tags=ghcr.io/${{ steps.repo.outputs.repo }}/mywebapp:latest,ghcr.io/${{ steps.repo.outputs.repo }}/mywebapp:sha-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set Docker tags for release tag
        if: github.ref_type == 'tag'
        id: release_tags
        run: |
          echo "tags=ghcr.io/${{ steps.repo.outputs.repo }}/mywebapp:stable,ghcr.io/${{ steps.repo.outputs.repo }}/mywebapp:${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image for branch
        if: github.ref_type == 'branch'
        uses: docker/build-push-action@v6
        with:
          context: ./mywebapp
          platforms: linux/arm64
          push: true
          tags: ${{ steps.branch_tags.outputs.tags }}

      - name: Build and push Docker image for tag
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: ./mywebapp
          platforms: linux/arm64
          push: true
          tags: ${{ steps.release_tags.outputs.tags }}