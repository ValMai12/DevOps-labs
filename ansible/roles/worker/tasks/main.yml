- name: Install worker packages
  apt:
    name:
      - nginx
      - python3-venv
      - python3-pip
    state: present

- name: Create app user
  user:
    name: app
    system: true
    shell: /usr/sbin/nologin
    home: /opt/mywebapp
    create_home: false

- name: Create operator user
  user:
    name: operator
    shell: /bin/bash
    groups: sudo
    append: true
    password: "{{ '12345678' | password_hash('sha512') }}"

- name: Create application directory
  file:
    path: /opt/mywebapp
    state: directory
    owner: app
    group: app
    mode: "0755"

- name: Copy app.py
  copy:
    src: ../../../mywebapp/app.py
    dest: /opt/mywebapp/app.py
    owner: app
    group: app
    mode: "0644"

- name: Copy migrate.py
  copy:
    src: ../../../mywebapp/migrate.py
    dest: /opt/mywebapp/migrate.py
    owner: app
    group: app
    mode: "0644"

- name: Copy requirements.txt
  copy:
    src: ../../../mywebapp/requirements.txt
    dest: /opt/mywebapp/requirements.txt
    owner: app
    group: app
    mode: "0644"

- name: Create Python virtual environment
  command: python3 -m venv /opt/mywebapp/venv
  args:
    creates: /opt/mywebapp/venv/bin/python

- name: Install application requirements
  pip:
    requirements: /opt/mywebapp/requirements.txt
    virtualenv: /opt/mywebapp/venv

- name: Install mywebapp systemd service
  template:
    src: mywebapp.service.j2
    dest: /etc/systemd/system/mywebapp.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart mywebapp

- name: Install nginx configuration
  template:
    src: mywebapp.nginx.j2
    dest: /etc/nginx/sites-available/mywebapp
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx site
  file:
    src: /etc/nginx/sites-available/mywebapp
    dest: /etc/nginx/sites-enabled/mywebapp
    state: link
  notify: Reload nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Configure operator sudo permissions
  template:
    src: operator-sudoers.j2
    dest: /etc/sudoers.d/operator-mywebapp
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Start and enable mywebapp
  systemd:
    name: mywebapp
    state: started
    enabled: true
    daemon_reload: true

- name: Start and enable nginx
  service:
    name: nginx
    state: started
    enabled: true
